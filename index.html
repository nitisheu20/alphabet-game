<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Alphabet Whiteboard Adventure (A–Z)</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#334155" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Fredoka', 'Comic Sans MS', sans-serif;
      background: #e2e8f0;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Whiteboard Frame */
    #whiteboard {
      position: relative;
      width: 96vw;
      height: 94vh;
      max-width: 1200px;
      background: #ffffff;
      background-image: radial-gradient(#cbd5e1 1.2px, transparent 1.2px);
      background-size: 28px 28px;
      border: 12px solid #334155;
      border-radius: 24px;
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.2), inset 0 0 20px rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Control Bar */
    #hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      background: #f8fafc;
      border-bottom: 3px solid #e2e8f0;
      z-index: 10;
      flex-wrap: wrap;
      gap: 10px;
    }

    .title-area h1 {
      margin: 0;
      font-size: clamp(1.2rem, 2.5vw, 1.7rem);
      color: #1e293b;
      letter-spacing: 0.5px;
    }

    .stats-area {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .badge {
      background: #eff6ff;
      border: 2px solid #bfdbfe;
      color: #1d4ed8;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: clamp(1rem, 2vw, 1.25rem);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge.timer {
      background: #fef3c7;
      border-color: #fde68a;
      color: #b45309;
      min-width: 115px;
      justify-content: center;
    }

    button.btn {
      font-family: 'Fredoka', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      padding: 8px 16px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      background: #3b82f6;
      color: white;
      box-shadow: 0 4px 0 #1d4ed8;
    }

    button.btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #1d4ed8;
    }

    button.btn.secondary {
      background: #64748b;
      box-shadow: 0 4px 0 #475569;
    }

    button.btn.secondary:active {
      box-shadow: 0 1px 0 #475569;
    }

    /* A-Z Target Tray */
    #tray-container {
      padding: 12px 18px;
      background: #f1f5f9;
      border-bottom: 3px dashed #cbd5e1;
      z-index: 5;
    }

    #tray {
      display: grid;
      grid-template-columns: repeat(13, 1fr);
      gap: 8px;
      max-width: 1050px;
      margin: 0 auto;
    }

    @media (max-width: 768px) {
      #tray {
        grid-template-columns: repeat(9, 1fr);
        gap: 6px;
      }
    }

    .slot {
      aspect-ratio: 1 / 1;
      background: #e2e8f0;
      border: 2.5px dashed #94a3b8;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.1rem, 2.2vw, 1.6rem);
      color: #94a3b8;
      position: relative;
      transition: background 0.2s, transform 0.2s;
    }

    .slot.highlight {
      background: #dbeafe;
      border-color: #3b82f6;
      transform: scale(1.06);
    }

    .slot.filled {
      border-style: solid;
      border-color: transparent;
      color: #ffffff;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.18);
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0.7); }
      70% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    /* Play Area where letters are scattered */
    #play-area {
      position: relative;
      flex: 1;
      width: 100%;
      overflow: hidden;
    }

    .hint-banner {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(241, 245, 249, 0.9);
      color: #475569;
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 0.95rem;
      pointer-events: none;
      border: 1px solid #cbd5e1;
    }

    /* Draggable Letter Tiles */
    .letter-tile {
      position: absolute;
      width: clamp(46px, 5.5vw, 64px);
      height: clamp(46px, 5.5vw, 64px);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.4rem, 2.8vw, 2rem);
      font-weight: 700;
      color: #ffffff;
      cursor: grab;
      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.2), 0 8px 15px rgba(0, 0, 0, 0.12);
      text-shadow: 0 2px 2px rgba(0, 0, 0, 0.2);
      transition: transform 0.1s ease;
      z-index: 20;
    }

    .letter-tile:hover {
      transform: scale(1.08);
    }

    .letter-tile.dragging {
      cursor: grabbing;
      transform: scale(1.18) rotate(0deg) !important;
      z-index: 100;
      box-shadow: 0 14px 25px rgba(0, 0, 0, 0.25);
    }

    .letter-tile.shake {
      animation: shake 0.35s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px) rotate(-6deg); }
      75% { transform: translateX(8px) rotate(6deg); }
    }

    /* Victory Modal */
    #victory-modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 500;
      backdrop-filter: blur(4px);
    }

    #victory-modal.active {
      display: flex;
    }

    .modal-card {
      background: #ffffff;
      border-radius: 28px;
      padding: 36px 40px;
      text-align: center;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
      border: 6px solid #facc15;
      animation: popIn 0.4s ease;
    }

    .modal-card h2 {
      font-size: 2.2rem;
      margin: 0 0 8px;
      color: #1e293b;
    }

    .modal-card p {
      font-size: 1.15rem;
      color: #475569;
      margin: 0 0 20px;
    }

    .final-time-box {
      background: #fef9c3;
      border: 3px solid #fde047;
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 24px;
    }

    .final-time-box span {
      display: block;
      font-size: 0.95rem;
      color: #854d0e;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .final-time-box strong {
      font-size: 2.4rem;
      color: #b45309;
    }

    /* Confetti Canvas */
    #confetti-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 450;
    }
  </style>
</head>
<body>

  <canvas id="confetti-canvas"></canvas>

  <div id="whiteboard">
    <!-- Top HUD -->
    <div id="hud">
      <div class="title-area">
        <h1>🎨 Alphabet Whiteboard (A–Z)</h1>
      </div>
      <div class="stats-area">
        <div class="badge" id="progress-badge">⭐ 0 / 26</div>
        <div class="badge timer" id="timer-display">⏱️ 00:00</div>
        <button class="btn secondary" id="sound-btn" title="Toggle Sound">🔊 Sound On</button>
        <button class="btn" id="reset-btn">🔄 Restart</button>
      </div>
    </div>

    <!-- A to Z Target Sequence Slots -->
    <div id="tray-container">
      <div id="tray"></div>
    </div>

    <!-- Scattered Letters Area -->
    <div id="play-area">
      <div class="hint-banner">Drag the colorful letters into their A–Z spots above!</div>
    </div>
  </div>

  <!-- Victory Screen -->
  <div id="victory-modal">
    <div class="modal-card">
      <h2>🎉 Great Job! 🎉</h2>
      <p>You arranged the entire alphabet from A to Z!</p>
      <div class="final-time-box">
        <span>Total Time Taken</span>
        <strong id="final-time">00:00</strong>
      </div>
      <button class="btn" id="play-again-btn" style="font-size: 1.25rem; padding: 12px 28px;">
        🚀 Play Again
      </button>
    </div>
  </div>

  <script>
    const ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
    const COLORS = [
      "#ef4444", "#f97316", "#f59e0b", "#84cc16", "#10b981",
      "#06b6d4", "#3b82f6", "#6366f1", "#8b5cf6", "#d946ef",
      "#ec4899", "#f43f5e", "#0ea5e9", "#14b8a6", "#eab308",
      "#ea580c", "#dc2626", "#7c3aed", "#2563eb", "#059669",
      "#db2777", "#9333ea", "#0284c7", "#65a30d", "#e11d48", "#4f46e5"
    ];

    const trayEl = document.getElementById("tray");
    const playAreaEl = document.getElementById("play-area");
    const timerDisplayEl = document.getElementById("timer-display");
    const progressBadgeEl = document.getElementById("progress-badge");
    const victoryModalEl = document.getElementById("victory-modal");
    const finalTimeEl = document.getElementById("final-time");
    const resetBtn = document.getElementById("reset-btn");
    const playAgainBtn = document.getElementById("play-again-btn");
    const soundBtn = document.getElementById("sound-btn");

    let placedCount = 0;
    let timerInterval = null;
    let startTime = null;
    let isRunning = false;
    let soundEnabled = true;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTone(freq, type = "sine", duration = 0.15, delay = 0) {
      if (!soundEnabled) return;
      if (audioCtx.state === "suspended") audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);
      gain.gain.setValueAtTime(0.18, audioCtx.currentTime + delay);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + delay);
      osc.stop(audioCtx.currentTime + delay + duration);
    }

    function playSuccessSound() {
      playTone(523.25, "triangle", 0.14, 0);
      playTone(659.25, "triangle", 0.18, 0.08);
    }

    function playWrongSound() {
      playTone(180, "sawtooth", 0.18, 0);
    }

    function playWinFanfare() {
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((n, i) => playTone(n, "triangle", 0.25, i * 0.12));
    }

    function formatTime(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const mins = Math.floor(totalSeconds / 60);
      const secs = totalSeconds % 60;
      const tenths = Math.floor((ms % 1000) / 100);
      return `${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}.${tenths}`;
    }

    function startTimer() {
      if (isRunning) return;
      isRunning = true;
      startTime = Date.now();
      timerInterval = setInterval(() => {
        const elapsed = Date.now() - startTime;
        timerDisplayEl.textContent = `⏱️ ${formatTime(elapsed)}`;
      }, 100);
    }

    function stopTimer() {
      isRunning = false;
      clearInterval(timerInterval);
      return Date.now() - startTime;
    }

    function initGame() {
      stopTimer();
      isRunning = false;
      startTime = null;
      placedCount = 0;
      timerDisplayEl.textContent = "⏱️ 00:00.0";
      progressBadgeEl.textContent = "⭐ 0 / 26";
      victoryModalEl.classList.remove("active");
      stopConfetti();

      trayEl.innerHTML = "";
      document.querySelectorAll(".letter-tile").forEach(el => el.remove());

      ALPHABET.forEach((letter) => {
        const slot = document.createElement("div");
        slot.className = "slot";
        slot.dataset.letter = letter;
        slot.textContent = letter;
        trayEl.appendChild(slot);
      });

      const shuffled = [...ALPHABET].sort(() => Math.random() - 0.5);
      const areaRect = playAreaEl.getBoundingClientRect();
      const tileSize = Math.min(Math.max(window.innerWidth * 0.055, 46), 64);
      const maxX = Math.max(areaRect.width - tileSize - 20, 40);
      const maxY = Math.max(areaRect.height - tileSize - 45, 40);

      const placedPositions = [];

      shuffled.forEach((letter) => {
        const colorIndex = ALPHABET.indexOf(letter);
        const tile = document.createElement("div");
        tile.className = "letter-tile";
        tile.textContent = letter;
        tile.dataset.letter = letter;
        tile.style.backgroundColor = COLORS[colorIndex];

        let x, y, attempts = 0;
        do {
          x = 15 + Math.random() * (maxX - 15);
          y = 15 + Math.random() * (maxY - 15);
          attempts++;
        } while (
          attempts < 40 &&
          placedPositions.some(p => Math.hypot(p.x - x, p.y - y) < tileSize * 0.95)
        );
        placedPositions.push({ x, y });

        const rot = (Math.random() * 24 - 12).toFixed(1);
        tile.style.left = `${x}px`;
        tile.style.top = `${y}px`;
        tile.style.transform = `rotate(${rot}deg)`;
        tile.dataset.rot = rot;

        makeDraggable(tile);
        playAreaEl.appendChild(tile);
      });
    }

    function makeDraggable(tile) {
      let offsetX = 0;
      let offsetY = 0;
      let isDragging = false;

      tile.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        startTimer();
        isDragging = true;
        tile.classList.add("dragging");
        tile.setPointerCapture(e.pointerId);

        const rect = tile.getBoundingClientRect();
        offsetX = e.clientX - rect.left;
        offsetY = e.clientY - rect.top;
      });

      tile.addEventListener("pointermove", (e) => {
        if (!isDragging) return;
        const areaRect = playAreaEl.getBoundingClientRect();
        const newLeft = e.clientX - areaRect.left - offsetX;
        const newTop = e.clientY - areaRect.top - offsetY;

        tile.style.left = `${newLeft}px`;
        tile.style.top = `${newTop}px`;

        highlightMatchingSlot(tile);
      });

      tile.addEventListener("pointerup", (e) => {
        if (!isDragging) return;
        isDragging = false;
        tile.classList.remove("dragging");
        tile.releasePointerCapture(e.pointerId);

        clearSlotHighlights();
        checkDrop(tile);
      });
    }

    function getOverlappingSlot(tile) {
      const tileRect = tile.getBoundingClientRect();
      const tileCenterX = tileRect.left + tileRect.width / 2;
      const tileCenterY = tileRect.top + tileRect.height / 2;

      const slots = document.querySelectorAll(".slot:not(.filled)");
      for (const slot of slots) {
        const sRect = slot.getBoundingClientRect();
        if (
          tileCenterX >= sRect.left - 12 &&
          tileCenterX <= sRect.right + 12 &&
          tileCenterY >= sRect.top - 12 &&
          tileCenterY <= sRect.bottom + 12
        ) {
          return slot;
        }
      }
      return null;
    }

    function highlightMatchingSlot(tile) {
      clearSlotHighlights();
      const slot = getOverlappingSlot(tile);
      if (slot) slot.classList.add("highlight");
    }

    function clearSlotHighlights() {
      document.querySelectorAll(".slot.highlight").forEach(s => s.classList.remove("highlight"));
    }

    function checkDrop(tile) {
      const slot = getOverlappingSlot(tile);
      if (!slot) {
        const areaRect = playAreaEl.getBoundingClientRect();
        let left = parseFloat(tile.style.left);
        let top = parseFloat(tile.style.top);
        left = Math.max(10, Math.min(left, areaRect.width - tile.offsetWidth - 10));
        top = Math.max(10, Math.min(top, areaRect.height - tile.offsetHeight - 10));
        tile.style.left = `${left}px`;
        tile.style.top = `${top}px`;
        tile.style.transform = `rotate(${tile.dataset.rot}deg)`;
        return;
      }

      if (slot.dataset.letter === tile.dataset.letter) {
        playSuccessSound();
        slot.classList.add("filled");
        slot.style.backgroundColor = tile.style.backgroundColor;
        tile.remove();

        placedCount++;
        progressBadgeEl.textContent = `⭐ ${placedCount} / 26`;

        if (placedCount === 26) {
          const totalMs = stopTimer();
          finalTimeEl.textContent = formatTime(totalMs);
          playWinFanfare();
          startConfetti();
          setTimeout(() => {
            victoryModalEl.classList.add("active");
          }, 450);
        }
      } else {
        playWrongSound();
        tile.classList.add("shake");
        const areaRect = playAreaEl.getBoundingClientRect();
        tile.style.top = `${Math.max(25, areaRect.height * 0.25)}px`;
        tile.style.transform = `rotate(${tile.dataset.rot}deg)`;
        setTimeout(() => tile.classList.remove("shake"), 360);
      }
    }

    const confettiCanvas = document.getElementById("confetti-canvas");
    const ctx = confettiCanvas.getContext("2d");
    let confettiPieces = [];
    let confettiAnimId = null;

    function startConfetti() {
      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;
      confettiPieces = Array.from({ length: 130 }, () => ({
        x: Math.random() * confettiCanvas.width,
        y: Math.random() * -confettiCanvas.height,
        w: 8 + Math.random() * 8,
        h: 6 + Math.random() * 6,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        speedY: 2.5 + Math.random() * 4,
        speedX: Math.random() * 3 - 1.5,
        rot: Math.random() * 360
      }));
      animateConfetti();
    }

    function animateConfetti() {
      ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      confettiPieces.forEach(p => {
        p.y += p.speedY;
        p.x += p.speedX;
        p.rot += 4;
        if (p.y > confettiCanvas.height) p.y = -10;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rot * Math.PI) / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      });
      confettiAnimId = requestAnimationFrame(animateConfetti);
    }

    function stopConfetti() {
      cancelAnimationFrame(confettiAnimId);
      ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    }

    resetBtn.addEventListener("click", initGame);
    playAgainBtn.addEventListener("click", initGame);
    soundBtn.addEventListener("click", () => {
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled ? "🔊 Sound On" : "🔇 Muted";
    });

    window.addEventListener("load", initGame);
  </script>
</body>
</html>
